name: Update category counts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*_news.json", "district_news.json", "tools/update_counts.py", ".github/workflows/counts.yml"]
permissions:
  contents: write
concurrency: { group: counts, cancel-in-progress: false }
jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/update_counts.py
      - name: Commit if changed
        run: |
          git config user.name "counts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news_category.json
          git diff --cached --quiet || (git commit -m "Update category counts" && git pull --rebase && git push)
